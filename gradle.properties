# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.caching=false
# Run independent project tasks concurrently. Gradle sizes the worker pool to the available processors.
org.gradle.parallel=true

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
